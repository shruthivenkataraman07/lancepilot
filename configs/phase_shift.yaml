# Experiment A: phase shift (synthetic). Hot set moves from objects 0..49 to 50..99.
name: phase_shift
workload:
  type: phase_shift
  seed: 42
  num_objects: 1000
  num_queries: 10000
  shift_at: 5000
  hot_a: [0, 50]
  hot_b: [50, 100]
  hot_fraction: 0.8
objects:
  size_median_kb: 256
  size_sigma: 0.6
  num_partitions: 8
  partition_latency_ms: [15, 80]
  bandwidth_mb_s: 100
cache:
  capacity_fraction: 0.06
  hit_latency_ms: 0.1
lancepilot:
  alpha: 0.01
  epsilon: 0.05
metrics:
  rolling_window: 200
  steady_window: 2000
  recovery_threshold: 0.95
